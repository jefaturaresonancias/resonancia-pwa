name: CI

on: [push, pull_request]

jobs:
  chequeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintaxis de todos los .js
        run: git -c core.quotepath=off ls-files -z '*.js' | xargs -0 -r -n1 node --check
